name: EscrowCrowd CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Smart Contracts (WASM Target)
        run: |
          cd contracts
          cargo build --target wasm32-unknown-unknown --release

      - name: Run Smart Contract Unit Tests
        run: |
          cd contracts
          cargo test

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter & Static Analysis
        run: npm run lint

      - name: Run Frontend Vitest Test Suite
        run: npm run test

      - name: Build Frontend Production Bundle
        run: npm run build
